<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover でノッチの内側まで使い、余白は CSS の safe-area で取る。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Repeading — 一文ずつリピーティング</title>

    <meta name="description" content="YouTube の字幕を一文ずつ区切って、聞いて、真似る。" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)" />

    <!-- ホーム画面に追加したときに全画面のアプリとして開く。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Repeading" />

    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      /* アプリの CSS が読めない場合にも出せるよう、この画面だけは素の style で持つ。 */
      #boot-error {
        max-width: 640px;
        margin: 40px auto;
        padding: 0 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
        line-height: 1.6;
        color: #1d1d1f;
      }
      #boot-error h1 {
        font-size: 22px;
      }
      #boot-error code {
        display: block;
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 10px;
        background: #f5f5f7;
        font-size: 13px;
        word-break: break-word;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot-error" hidden>
      <h1>読み込めませんでした</h1>
      <p>
        お使いのブラウザが対応していない可能性があります。
        下の内容をそのまま伝えてもらえれば原因を特定できます。
      </p>
      <code id="boot-error-detail"></code>
    </div>

    <script>
      // モジュールの構文エラーは白画面になり、何が起きたのか分からなくなる。
      // 起動できなかったことだけは必ず画面に出す。
      (function () {
        var box = document.getElementById('boot-error');
        var detail = document.getElementById('boot-error-detail');

        function show(message) {
          if (!box.hidden) return;
          box.hidden = false;
          detail.textContent = message + '\n\n' + navigator.userAgent;
        }

        // 画面が出ていれば起動は成功している。以降の失敗はここでは扱わない。
        function started() {
          var root = document.getElementById('root');
          return !!(root && root.firstChild);
        }

        /*
         * ビルド前のこの HTML がそのまま配信されていないか。
         * ビルド後は Vite がエントリを ./assets/*.js に書き換えるので、
         * /src/ のままなら成果物ではなくリポジトリの中身が配信されている。
         * 該当すれば、ただの読み込み失敗ではなく原因を名指しで返す。
         */
        function unbuiltNotice(url) {
          var local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
          if (local || url.lastIndexOf(location.origin + '/src/', 0) !== 0) return '';
          return (
            'ビルド前のソースが配信されています。\n' +
            'GitHub Pages の Source が「Deploy from a branch」のままだと、\n' +
            'ビルド成果物ではなくリポジトリの中身がそのまま配信されます。\n' +
            'Settings → Pages → Source を「GitHub Actions」に変えてください。'
          );
        }

        // 第 3 引数の true が要る。スクリプトや CSS の読み込み失敗は
        // window までバブリングせず、キャプチャフェーズでしか拾えない。
        window.addEventListener(
          'error',
          function (event) {
            if (started()) return;
            var target = event.target;
            if (target && target !== window && target.tagName) {
              var url = target.src || target.href || '';
              // YouTube など外部の読み込み失敗は起動の失敗ではないので黙っておく。
              if (url && url.lastIndexOf(location.origin, 0) !== 0) return;
              show(unbuiltNotice(url) || '読み込み失敗: ' + (url || target.tagName));
              return;
            }
            show(event.message || String(event.error || 'unknown error'));
          },
          true,
        );

        window.addEventListener('unhandledrejection', function (event) {
          if (started()) return;
          var reason = event.reason;
          show('unhandled rejection: ' + ((reason && reason.message) || String(reason)));
        });

        // 読み込みエラーが出ないまま黙って失敗する場合もあるので、こちらでも見る。
        document.addEventListener('DOMContentLoaded', function () {
          var entry = document.querySelector('script[type="module"][src]');
          if (!entry) return;
          var notice = unbuiltNotice(new URL(entry.getAttribute('src'), location.href).href);
          if (notice) show(notice);
        });

        // 例外が出ないまま描画されないこともあるので、一定時間で見切る。
        window.setTimeout(function () {
          if (!document.getElementById('root').firstChild) {
            show('画面が描画されませんでした（スクリプトが実行されていない可能性があります）');
          }
        }, 8000);
      })();
    </script>

    <noscript>
      <p style="font-family: sans-serif; padding: 20px">
        このアプリは JavaScript が必要です。有効にして開き直してください。
      </p>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
